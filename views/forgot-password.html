<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8">
    <h2 class="text-2xl font-bold text-center text-green-700">Forgot Password</h2>
    <p class="text-sm text-gray-600 text-center mt-2">
      Enter your email and we’ll send a reset link
    </p>

    <form id="forgotForm" class="mt-6 space-y-4">
      <input
        type="email"
        required
        placeholder="your@email.com"
        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-500"
      />

      <button
        type="submit"
        class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-semibold"
      >
        Send Reset Link
      </button>
    </form>

    <div id="msg" class="mt-4 text-center"></div>

    <div class="mt-6 text-center">
      <a href="/login" class="text-sm text-green-600 hover:underline">
        Back to login
      </a>
    </div>
  </div>

<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = e.target[0].value;
  const msg = document.getElementById("msg");

  msg.innerHTML = "Sending reset link...";

  const res = await fetch("/api/auth/forgot-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email })
  });

  const result = await res.json();
  msg.innerHTML = `<span class="text-green-600">${result.message}</span>`;
});
</script>

</body>
</html>
