<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - Food Ordering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.5s ease-out; }
  </style>
</head>
<body class="bg-gradient-to-br from-green-50 via-white to-green-50 min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-white/80 backdrop-blur-lg text-gray-800 shadow-xl sticky top-0 z-50 border-b border-green-100">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between py-3">
        <a href="/" class="text-base md:text-lg font-semibold mb-2 md:mb-0 flex items-center gap-2 hover:opacity-80 transition-opacity">
          <div class="w-10 h-10 bg-gradient-to-br from-green-600 to-green-700 rounded-xl flex items-center justify-center shadow-lg">
            <i class="fas fa-utensils text-white text-sm"></i>
          </div>
          <span class="bg-gradient-to-r from-green-600 to-green-700 bg-clip-text text-transparent font-bold">FoodOrdering</span>
        </a>
        <div class="flex flex-wrap gap-2">
          <a href="/" class="px-4 py-2 rounded-lg hover:bg-green-50 transition-all duration-200 flex items-center gap-2 text-sm font-medium">
            <i class="fas fa-home text-green-600 text-xs"></i>
            <span>Home</span>
          </a>
          <a href="/login" class="px-4 py-2 rounded-lg bg-gradient-to-r from-green-600 to-green-700 text-white hover:from-green-700 hover:to-green-800 transition-all duration-200 flex items-center gap-2 text-sm font-semibold shadow-lg hover:shadow-xl transform hover:scale-105">
            <i class="fas fa-sign-in-alt text-xs"></i>
            <span>Login</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex items-center justify-center px-4 py-12 md:py-20">
    <div class="w-full max-w-md fade-in">
      <!-- Card -->
      <div class="bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-100">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 px-8 py-6 text-center relative overflow-hidden">
          <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSAxMCAwIEwgMCAwIDAgMTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS1vcGFjaXR5PSIwLjEiIHN0cm9rZS13aWR0aD0iMSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNncmlkKSIvPjwvc3ZnPg==')] opacity-50"></div>
          
          <div class="relative">
            <div class="w-16 h-16 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center mx-auto mb-4">
              <i class="fas fa-key text-white text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Forgot Password?</h2>
            <p class="text-green-100 text-sm">
              No worries! We'll send you reset instructions
            </p>
          </div>
        </div>

        <!-- Form -->
        <div class="p-8">
          <form id="forgotForm" class="space-y-5">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-2">Email Address</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                  <i class="fas fa-envelope text-gray-400 text-sm"></i>
                </div>
                <input
                  type="email"
                  id="email"
                  required
                  placeholder="your@email.com"
                  class="w-full pl-11 pr-4 py-3 border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm"
                />
              </div>
            </div>

            <button
              type="submit"
              class="w-full bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white py-3 rounded-lg font-bold shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-[1.02] text-sm flex items-center justify-center gap-2"
            >
              <i class="fas fa-paper-plane"></i>
              <span>Send Reset Link</span>
            </button>
          </form>

          <div id="msg" class="mt-4 text-center text-sm"></div>

          <!-- Divider -->
          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-200"></div>
            </div>
            <div class="relative flex justify-center text-xs">
              <span class="px-3 bg-white text-gray-500">Remember your password?</span>
            </div>
          </div>

          <!-- Back to Login -->
          <div class="text-center">
            <a href="/login" class="inline-flex items-center gap-2 text-sm text-green-600 hover:text-green-700 font-semibold transition-colors group">
              <i class="fas fa-arrow-left text-xs group-hover:-translate-x-1 transition-transform"></i>
              <span>Back to Login</span>
            </a>
          </div>

          <!-- Help Section -->
          <div class="mt-8 p-4 bg-blue-50 border border-blue-200 rounded-lg">
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0">
                <i class="fas fa-info-circle text-blue-600 text-sm"></i>
              </div>
              <div>
                <h4 class="text-xs font-bold text-blue-900 mb-1">Need Help?</h4>
                <p class="text-xs text-blue-700 leading-relaxed">
                  If you don't receive the email within 5 minutes, check your spam folder or contact support.
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Security Notice -->
      <div class="mt-6 text-center">
        <p class="text-xs text-gray-500 flex items-center justify-center gap-2">
          <i class="fas fa-shield-alt text-green-600"></i>
          Your account security is our priority
        </p>
      </div>
    </div>
  </div>

  <!-- Success Toast -->
  <div id="successToast" class="hidden fixed top-20 right-4 bg-gradient-to-r from-green-600 to-green-700 text-white px-4 py-3 rounded-lg shadow-2xl z-50 backdrop-blur-sm border border-green-500/20">
    <div class="flex items-center gap-2">
      <i class="fas fa-check-circle text-sm"></i>
      <p id="toastMessage" class="text-sm font-medium"></p>
    </div>
  </div>

<script>
function showToast(message, isError = false) {
  const toast = document.getElementById('successToast');
  toast.className = `fixed top-20 right-4 px-4 py-3 rounded-lg shadow-2xl z-50 backdrop-blur-sm border ${isError ? 'bg-gradient-to-r from-red-600 to-red-700 border-red-500/20' : 'bg-gradient-to-r from-green-600 to-green-700 border-green-500/20'} text-white flex items-center gap-2`;
  document.getElementById('toastMessage').textContent = message;
  toast.classList.remove('hidden');
  setTimeout(() => {
    toast.classList.add('hidden');
  }, 4000);
}

document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const msg = document.getElementById("msg");
  const submitBtn = e.target.querySelector('button[type="submit"]');

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Sending...</span>';
  msg.innerHTML = "";

  try {
    const res = await fetch("/api/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });

    const result = await res.json();

    if (res.ok) {
      msg.innerHTML = `
        <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg flex items-start gap-3">
          <i class="fas fa-check-circle text-green-600 mt-0.5"></i>
          <div class="text-left">
            <p class="font-semibold text-xs mb-1">Email Sent!</p>
            <p class="text-xs">${result.message}</p>
          </div>
        </div>
      `;
      showToast("Reset link sent successfully!");
      document.getElementById("email").value = "";
    } else {
      msg.innerHTML = `
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg flex items-start gap-3">
          <i class="fas fa-exclamation-circle text-red-600 mt-0.5"></i>
          <p class="text-xs">${result.message || "Failed to send reset link"}</p>
        </div>
      `;
    }
  } catch (err) {
    msg.innerHTML = `
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg flex items-start gap-3">
        <i class="fas fa-exclamation-circle text-red-600 mt-0.5"></i>
        <p class="text-xs">Server error. Please try again later.</p>
      </div>
    `;
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i><span>Send Reset Link</span>';
  }
});
</script>

</body>
</html>
