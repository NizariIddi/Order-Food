<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 text-white shadow-xl sticky top-0 z-50 backdrop-blur-sm">
    <div class="container mx-auto px-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between py-4">
        <a href="/" class="text-base md:text-lg font-bold mb-3 md:mb-0 flex items-center gap-2 hover:opacity-90 transition-opacity">
          <i class="fas fa-utensils"></i>
          <span>Food Ordering</span>
        </a>
        <div class="flex flex-wrap gap-1 text-sm md:text-base">
          <a href="/" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-2">
            <i class="fas fa-home"></i>
            <span>Home</span>
          </a>
          <a href="/menu" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-2">
            <i class="fas fa-book-open"></i>
            <span>Menu</span>
          </a>
          <a href="/orders" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-2">
            <i class="fas fa-shopping-bag"></i>
            <span>Orders</span>
          </a>
          <a href="/admin/products" class="px-4 py-2 rounded-lg bg-white/20 font-medium transition-all duration-200 backdrop-blur-sm shadow-lg flex items-center gap-2">
            <i class="fas fa-shield-halved"></i>
            <span>Admin</span>
          </a>
          <a 
            id="logoutBtn" 
            href="#"
            class="px-4 py-2 rounded-lg bg-red-600/90 hover:bg-red-700 transition-all duration-200 cursor-pointer font-medium shadow-md ml-2 flex items-center gap-2"
          >
            <i class="fas fa-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-6 py-8">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
      <div>
        <div class="flex items-center gap-3 mb-2">
          <div class="h-1 w-12 bg-gradient-to-r from-green-600 to-green-400 rounded-full"></div>
          <h1 class="text-xl md:text-2xl font-bold text-gray-800">Admin Panel</h1>
        </div>
        <p class="text-sm md:text-base text-gray-600 ml-15">Manage your products and inventory</p>
      </div>
      <div class="flex gap-3">
        <button onclick="openAddModal()" class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-4 md:px-6 py-2.5 md:py-3 rounded-xl transition-all duration-200 shadow-lg hover:shadow-xl font-semibold transform hover:scale-[1.02] active:scale-[0.98] flex items-center gap-2 text-sm md:text-base">
          <i class="fas fa-plus"></i>
          <span>Add Product</span>
        </button>
        <a href="/admin/orders" class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white px-4 md:px-6 py-2.5 md:py-3 rounded-xl transition-all duration-200 shadow-lg hover:shadow-xl font-semibold transform hover:scale-[1.02] active:scale-[0.98] flex items-center gap-2 text-sm md:text-base">
          <i class="fas fa-shopping-cart"></i>
          <span>Orders</span>
        </a>
      </div>
    </div>

    <!-- Products Table -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
      <div class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 px-6 py-5">
        <h2 class="text-base md:text-lg font-bold text-white flex items-center gap-2">
          <i class="fas fa-box"></i>
          <span>Products Inventory</span>
        </h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full" id="productsTable">
          <thead class="bg-gradient-to-r from-gray-50 to-gray-100 border-b-2 border-gray-200">
            <tr>
              <th class="px-4 md:px-6 py-3 md:py-4 text-left text-xs md:text-sm font-bold text-gray-700">ID</th>
              <th class="px-4 md:px-6 py-3 md:py-4 text-left text-xs md:text-sm font-bold text-gray-700">Name</th>
              <th class="px-4 md:px-6 py-3 md:py-4 text-left text-xs md:text-sm font-bold text-gray-700">Description</th>
              <th class="px-4 md:px-6 py-3 md:py-4 text-left text-xs md:text-sm font-bold text-gray-700">Price</th>
              <th class="px-4 md:px-6 py-3 md:py-4 text-left text-xs md:text-sm font-bold text-gray-700">Status</th>
              <th class="px-4 md:px-6 py-3 md:py-4 text-left text-xs md:text-sm font-bold text-gray-700">Image URL</th>
              <th class="px-4 md:px-6 py-3 md:py-4 text-center text-xs md:text-sm font-bold text-gray-700">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add Product Modal -->
  <div id="addModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto transform transition-all">
      <div class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 px-6 md:px-8 py-4 md:py-6 flex justify-between items-center">
        <div>
          <h2 class="text-lg md:text-xl font-bold text-white mb-1 flex items-center gap-2">
            <i class="fas fa-plus-circle"></i>
            <span>Add New Product</span>
          </h2>
          <p class="text-green-100 text-xs md:text-sm">Fill in the product details below</p>
        </div>
        <button onclick="closeAddModal()" class="text-white hover:bg-white/20 rounded-full w-8 h-8 md:w-10 md:h-10 flex items-center justify-center text-xl md:text-2xl font-bold transition-colors">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="p-6 md:p-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
          <div class="md:col-span-2">
            <label class="block text-xs md:text-sm font-bold text-gray-700 mb-2">Product Name</label>
            <input type="text" id="name" placeholder="Enter product name" class="border-2 border-gray-200 p-2.5 md:p-3 rounded-xl w-full focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm md:text-base">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs md:text-sm font-bold text-gray-700 mb-2">Description</label>
            <textarea id="description" placeholder="Enter product description" rows="3" class="border-2 border-gray-200 p-2.5 md:p-3 rounded-xl w-full focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm md:text-base"></textarea>
          </div>
          <div>
            <label class="block text-xs md:text-sm font-bold text-gray-700 mb-2">Price ($)</label>
            <input type="number" id="price" placeholder="0.00" step="0.01" class="border-2 border-gray-200 p-2.5 md:p-3 rounded-xl w-full focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm md:text-base">
          </div>
          <div>
            <label class="block text-xs md:text-sm font-bold text-gray-700 mb-2">Status</label>
            <select id="status" class="border-2 border-gray-200 p-2.5 md:p-3 rounded-xl w-full focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm md:text-base">
              <option value="available">Available</option>
              <option value="unavailable">Unavailable</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs md:text-sm font-bold text-gray-700 mb-2">Image URL</label>
            <input type="text" id="image_url" placeholder="https://example.com/image.jpg" class="border-2 border-gray-200 p-2.5 md:p-3 rounded-xl w-full focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm md:text-base">
          </div>
        </div>
        <div class="flex gap-3 mt-6 md:mt-8">
          <button onclick="addProduct()" class="flex-1 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-4 md:px-6 py-3 md:py-4 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-[1.02] text-sm md:text-base">
            Add Product
          </button>
          <button onclick="closeAddModal()" class="px-6 md:px-8 py-3 md:py-4 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl font-bold transition-all duration-200 text-sm md:text-base">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Product Modal -->
  <div id="editModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto transform transition-all">
      <div class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 px-6 md:px-8 py-4 md:py-6 flex justify-between items-center">
        <div>
          <h2 class="text-lg md:text-xl font-bold text-white mb-1 flex items-center gap-2">
            <i class="fas fa-edit"></i>
            <span>Edit Product</span>
          </h2>
          <p class="text-green-100 text-xs md:text-sm">Update the product details below</p>
        </div>
        <button onclick="closeEditModal()" class="text-white hover:bg-white/20 rounded-full w-8 h-8 md:w-10 md:h-10 flex items-center justify-center text-xl md:text-2xl font-bold transition-colors">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="p-6 md:p-8">
        <input type="hidden" id="edit_id">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
          <div class="md:col-span-2">
            <label class="block text-xs md:text-sm font-bold text-gray-700 mb-2">Product Name</label>
            <input type="text" id="edit_name" class="border-2 border-gray-200 p-2.5 md:p-3 rounded-xl w-full focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm md:text-base">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs md:text-sm font-bold text-gray-700 mb-2">Description</label>
            <textarea id="edit_description" rows="3" class="border-2 border-gray-200 p-2.5 md:p-3 rounded-xl w-full focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm md:text-base"></textarea>
          </div>
          <div>
            <label class="block text-xs md:text-sm font-bold text-gray-700 mb-2">Price ($)</label>
            <input type="number" id="edit_price" step="0.01" class="border-2 border-gray-200 p-2.5 md:p-3 rounded-xl w-full focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm md:text-base">
          </div>
          <div>
            <label class="block text-xs md:text-sm font-bold text-gray-700 mb-2">Status</label>
            <select id="edit_status" class="border-2 border-gray-200 p-2.5 md:p-3 rounded-xl w-full focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm md:text-base">
              <option value="available">Available</option>
              <option value="unavailable">Unavailable</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs md:text-sm font-bold text-gray-700 mb-2">Image URL</label>
            <input type="text" id="edit_image_url" class="border-2 border-gray-200 p-2.5 md:p-3 rounded-xl w-full focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all text-sm md:text-base">
          </div>
        </div>
        <div class="flex gap-3 mt-6 md:mt-8">
          <button onclick="updateProduct()" class="flex-1 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-4 md:px-6 py-3 md:py-4 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-[1.02] text-sm md:text-base">
            Update Product
          </button>
          <button onclick="closeEditModal()" class="px-6 md:px-8 py-3 md:py-4 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl font-bold transition-all duration-200 text-sm md:text-base">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Success Toast -->
  <div id="successToast" class="hidden fixed top-24 right-6 bg-gradient-to-r from-green-600 to-green-700 text-white px-4 md:px-6 py-3 md:py-4 rounded-xl shadow-2xl z-50 backdrop-blur-sm border border-green-500/20">
    <div class="flex items-center gap-2 md:gap-3">
      <i class="fas fa-check-circle text-lg md:text-xl"></i>
      <p id="toastMessage" class="font-semibold text-sm md:text-base"></p>
    </div>
  </div>

  <script>
    const tbody = document.querySelector("#productsTable tbody");

    function openAddModal() { 
      document.getElementById('addModal').classList.remove('hidden'); 
    }
    function closeAddModal() { 
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById("name").value = "";
      document.getElementById("description").value = "";
      document.getElementById("price").value = "";
      document.getElementById("image_url").value = "";
      document.getElementById("status").value = "available";
    }

    function openEditModal(product) {
      document.getElementById('edit_id').value = product.id;
      document.getElementById('edit_name').value = product.name;
      document.getElementById('edit_description').value = product.description;
      document.getElementById('edit_price').value = product.price;
      document.getElementById('edit_image_url').value = product.image_url;
      document.getElementById('edit_status').value = product.status;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

    function showToast(message) {
      const toast = document.getElementById('successToast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 3000);
    }

    async function fetchProducts() {
      try {
        const res = await fetch("/api/admin/products");
        if (!res.ok) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-red-500 font-medium text-sm md:text-base">Failed to load products.</td></tr>'; return; }
        const products = await res.json();
        tbody.innerHTML = "";
        if (products.length === 0) { 
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12"><div class="flex flex-col items-center"><i class="fas fa-box-open text-5xl md:text-6xl text-gray-300 mb-3"></i><p class="text-gray-500 font-medium text-sm md:text-base">No products yet. Add your first product!</p></div></td></tr>'; 
          return; 
        }

        products.forEach(p => {
          const tr = document.createElement("tr");
          tr.className = "border-b border-gray-100 hover:bg-gradient-to-r hover:from-green-50 hover:to-transparent transition-all duration-200";
          tr.innerHTML = `
            <td class="px-4 md:px-6 py-3 md:py-4 text-xs md:text-sm font-bold text-gray-700">#${p.id}</td>
            <td class="px-4 md:px-6 py-3 md:py-4 font-semibold text-gray-800 text-xs md:text-sm">${p.name}</td>
            <td class="px-4 md:px-6 py-3 md:py-4 text-xs md:text-sm text-gray-600 max-w-xs">${p.description}</td>
            <td class="px-4 md:px-6 py-3 md:py-4 font-bold text-green-600 text-sm md:text-base">$${parseFloat(p.price).toFixed(2)}</td>
            <td class="px-4 md:px-6 py-3 md:py-4">
              <span class="px-2 md:px-3 py-1 md:py-1.5 rounded-full text-xs font-bold inline-flex items-center gap-1
                ${p.status === "available" ? "bg-green-100 text-green-700 border border-green-200" : "bg-red-100 text-red-700 border border-red-200"}">
                <i class="fas fa-${p.status === "available" ? "check" : "times"}"></i>
                ${p.status}
              </span>
            </td>
            <td class="px-4 md:px-6 py-3 md:py-4 text-xs md:text-sm text-gray-600 max-w-xs truncate">${p.image_url}</td>
            <td class="px-4 md:px-6 py-3 md:py-4">
              <div class="flex justify-center gap-2">
                <button onclick='openEditModal(${JSON.stringify(p)})' 
                  class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white p-2 md:p-2.5 rounded-lg shadow-md hover:shadow-lg transition-all transform hover:scale-110 active:scale-95"
                  title="Edit">
                  <i class="fas fa-pen text-xs md:text-sm"></i>
                </button>
                <button onclick="toggleStatus(${p.id}, '${p.status}')" 
                  class="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700 text-white p-2 md:p-2.5 rounded-lg shadow-md hover:shadow-lg transition-all transform hover:scale-110 active:scale-95"
                  title="Toggle Status">
                  <i class="fas fa-sync-alt text-xs md:text-sm"></i>
                </button>
                <button onclick="deleteProduct(${p.id})" 
                  class="bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white p-2 md:p-2.5 rounded-lg shadow-md hover:shadow-lg transition-all transform hover:scale-110 active:scale-95"
                  title="Delete">
                  <i class="fas fa-trash text-xs md:text-sm"></i>
                </button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-red-500 font-medium text-sm md:text-base">Error loading products. Please refresh the page.</td></tr>';
      }
    }

    async function addProduct() {
      const name = document.getElementById("name").value.trim();
      const description = document.getElementById("description").value.trim();
      const price = parseFloat(document.getElementById("price").value);
      const image_url = document.getElementById("image_url").value.trim();
      const status = document.getElementById("status").value;

      if (!name || !description || isNaN(price) || !image_url || !status) { alert("Please fill in all fields"); return; }
      if (price <= 0) { alert("Price must be > 0"); return; }

      const res = await fetch("/api/admin/products", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name,description,price,image_url,status}) });
      if (!res.ok) { const error = await res.json(); alert(error.message || "Failed"); return; }

      closeAddModal(); showToast("Product added successfully!"); fetchProducts();
    }

    async function updateProduct() {
      const id = document.getElementById('edit_id').value;
      const name = document.getElementById('edit_name').value.trim();
      const description = document.getElementById('edit_description').value.trim();
      const price = parseFloat(document.getElementById('edit_price').value);
      const image_url = document.getElementById('edit_image_url').value.trim();
      const status = document.getElementById('edit_status').value;

      if (!name || !description || isNaN(price) || !image_url || !status) { alert("Please fill in all fields"); return; }
      if (price <= 0) { alert("Price must be > 0"); return; }

      const res = await fetch(`/api/admin/products/${id}`, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name,description,price,image_url,status}) });
      if (!res.ok) { const error = await res.json(); alert(error.message || "Failed"); return; }

      closeEditModal(); showToast("Product updated successfully!"); fetchProducts();
    }

    async function deleteProduct(id) {
      if (confirm("⚠️ Are you sure you want to delete this product? This action cannot be undone.")) {
        await fetch(`/api/admin/products/${id}`, { method:"DELETE" });
        showToast("Product deleted successfully!"); fetchProducts();
      }
    }

    async function toggleStatus(id, currentStatus) {
      const newStatus = currentStatus === "available" ? "unavailable" : "available";
      const res = await fetch(`/api/admin/products/${id}/status`, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({status:newStatus}) });
      if (!res.ok) { alert("Failed to update status"); return; }
      showToast("Product status updated!"); fetchProducts();
    }

    fetchProducts();

    document.getElementById("logoutBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      
      if (confirm("⚠️ Are you sure you want to logout?")) {
        try {
          const response = await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include"
          });

          const data = await response.json();
          console.log(data.message);

          localStorage.removeItem("user");
          window.location.href = "/";

        } catch (error) {
          console.error("Logout failed:", error);
          alert("Failed to logout. Please try again.");
        }
      }
    });
  </script>
</body>
</html>
