<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-gradient-to-r from-green-600 to-green-700 text-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between py-4">
        <a href="/" class="text-2xl md:text-3xl font-bold mb-3 md:mb-0">🍔 Food Ordering</a>
        <div class="flex flex-wrap gap-2 md:gap-1">
          <a href="/" class="px-4 py-2 rounded-lg hover:bg-green-500 transition-colors duration-200">Home</a>
          <a href="/menu" class="px-4 py-2 rounded-lg hover:bg-green-500 transition-colors duration-200">Menu</a>
          <a href="/orders" class="px-4 py-2 rounded-lg hover:bg-green-500 transition-colors duration-200">Orders</a>
          <a href="/login" class="px-4 py-2 rounded-lg hover:bg-green-500 transition-colors duration-200">Login</a>
          <a href="/admin/products" class="px-4 py-2 rounded-lg bg-green-500 font-medium transition-colors duration-200">Admin</a>
          <a 
          id="logoutBtn" 
          href="#"
          class="px-4 py-2 rounded-lg hover:bg-red-500 transition-colors duration-200 cursor-pointer"
        >
          Logout
        </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Admin Panel - Manage Products</h1>
      <div class="flex gap-2">
        <button onclick="openAddModal()" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors duration-200 shadow-md font-medium">
          ➕ Add Product
        </button>
        <a href="/admin/orders" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors duration-200 shadow-md font-medium">
          🛒 Orders
        </a>
      </div>
    </div>

    <!-- Products Table -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="bg-gradient-to-r from-green-500 to-green-600 px-6 py-4">
        <h2 class="text-xl md:text-2xl font-bold text-white">Products</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full" id="productsTable">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">ID</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Name</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Description</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Price</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Status</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Image URL</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add Product Modal -->
  <div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="bg-gradient-to-r from-green-500 to-green-600 px-6 py-4 flex justify-between items-center">
        <h2 class="text-2xl font-bold text-white">Add New Product</h2>
        <button onclick="closeAddModal()" class="text-white hover:text-gray-200 text-3xl font-bold">&times;</button>
      </div>
      <div class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Product Name</label>
            <input type="text" id="name" placeholder="Enter product name" class="border border-gray-300 p-3 rounded-lg w-full focus:ring-2 focus:ring-green-500 focus:border-transparent">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
            <textarea id="description" placeholder="Enter product description" rows="3" class="border border-gray-300 p-3 rounded-lg w-full focus:ring-2 focus:ring-green-500 focus:border-transparent"></textarea>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Price ($)</label>
            <input type="number" id="price" placeholder="0.00" step="0.01" class="border border-gray-300 p-3 rounded-lg w-full focus:ring-2 focus:ring-green-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Image URL</label>
            <input type="text" id="image_url" placeholder="https://example.com/image.jpg" class="border border-gray-300 p-3 rounded-lg w-full focus:ring-2 focus:ring-green-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
            <select id="status" class="border border-gray-300 p-3 rounded-lg w-full focus:ring-2 focus:ring-green-500">
              <option value="available">Available</option>
              <option value="unavailable">Unavailable</option>
            </select>
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button onclick="addProduct()" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-semibold shadow-md transition-colors duration-200">
            Add Product
          </button>
          <button onclick="closeAddModal()" class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg font-semibold transition-colors duration-200">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Product Modal -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="bg-gradient-to-r from-green-500 to-green-600 px-6 py-4 flex justify-between items-center">
        <h2 class="text-2xl font-bold text-white">Edit Product</h2>
        <button onclick="closeEditModal()" class="text-white hover:text-gray-200 text-3xl font-bold">&times;</button>
      </div>
      <div class="p-6">
        <input type="hidden" id="edit_id">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Product Name</label>
            <input type="text" id="edit_name" class="border border-gray-300 p-3 rounded-lg w-full focus:ring-2 focus:ring-green-500 focus:border-transparent">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
            <textarea id="edit_description" rows="3" class="border border-gray-300 p-3 rounded-lg w-full focus:ring-2 focus:ring-green-500 focus:border-transparent"></textarea>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Price ($)</label>
            <input type="number" id="edit_price" step="0.01" class="border border-gray-300 p-3 rounded-lg w-full focus:ring-2 focus:ring-green-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Image URL</label>
            <input type="text" id="edit_image_url" class="border border-gray-300 p-3 rounded-lg w-full focus:ring-2 focus:ring-green-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
            <select id="edit_status" class="border border-gray-300 p-3 rounded-lg w-full focus:ring-2 focus:ring-green-500">
              <option value="available">Available</option>
              <option value="unavailable">Unavailable</option>
            </select>
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button onclick="updateProduct()" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-semibold shadow-md transition-colors duration-200">
            Update Product
          </button>
          <button onclick="closeEditModal()" class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg font-semibold transition-colors duration-200">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Success Toast -->
  <div id="successToast" class="hidden fixed top-20 right-4 bg-green-600 text-white px-6 py-4 rounded-lg shadow-lg z-50">
    <p id="toastMessage" class="font-semibold"></p>
  </div>

  <script>
    const tbody = document.querySelector("#productsTable tbody");

    function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeAddModal() { 
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById("name").value = "";
      document.getElementById("description").value = "";
      document.getElementById("price").value = "";
      document.getElementById("image_url").value = "";
      document.getElementById("status").value = "available";
    }

    function openEditModal(product) {
      document.getElementById('edit_id').value = product.id;
      document.getElementById('edit_name').value = product.name;
      document.getElementById('edit_description').value = product.description;
      document.getElementById('edit_price').value = product.price;
      document.getElementById('edit_image_url').value = product.image_url;
      document.getElementById('edit_status').value = product.status;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

    function showToast(message) {
      const toast = document.getElementById('successToast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 3000);
    }

    async function fetchProducts() {
      try {
        const res = await fetch("/api/admin/products");
        if (!res.ok) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-red-500">Failed to load products.</td></tr>'; return; }
        const products = await res.json();
        tbody.innerHTML = "";
        if (products.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-gray-500">No products yet.</td></tr>'; return; }

        products.forEach(p => {
          const tr = document.createElement("tr");
          tr.className = "border-b border-gray-200 hover:bg-gray-50 transition-colors";
          tr.innerHTML = `
            <td class="px-4 py-3 text-sm font-semibold">#${p.id}</td>
            <td class="px-4 py-3 font-medium">${p.name}</td>
            <td class="px-4 py-3 text-sm text-gray-600">${p.description}</td>
            <td class="px-4 py-3 font-bold text-green-600">${parseFloat(p.price).toFixed(2)}</td>
            <td class="px-4 py-3">
              <span class="px-3 py-1 rounded-full text-xs font-semibold
                ${p.status === "available" ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}">
                ${p.status}
              </span>
            </td>
            <td class="px-4 py-3 text-sm text-gray-600 max-w-xs truncate">${p.image_url}</td>
            <td class="px-4 py-3">
              <div class="flex flex-col sm:flex-row gap-2">
                <button onclick='openEditModal(${JSON.stringify(p)})' class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded text-sm">Edit</button>
                <button onclick="toggleStatus(${p.id}, '${p.status}')" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded text-sm">Toggle</button>
                <button onclick="deleteProduct(${p.id})" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm">Delete</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-red-500">Error loading products. Refresh page.</td></tr>';
      }
    }

    async function addProduct() {
      const name = document.getElementById("name").value.trim();
      const description = document.getElementById("description").value.trim();
      const price = parseFloat(document.getElementById("price").value);
      const image_url = document.getElementById("image_url").value.trim();
      const status = document.getElementById("status").value;

      if (!name || !description || isNaN(price) || !image_url || !status) { alert("Please fill in all fields"); return; }
      if (price <= 0) { alert("Price must be > 0"); return; }

      const res = await fetch("/api/admin/products", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name,description,price,image_url,status}) });
      if (!res.ok) { const error = await res.json(); alert(error.message || "Failed"); return; }

      closeAddModal(); showToast("Product added successfully!"); fetchProducts();
    }

    async function updateProduct() {
      const id = document.getElementById('edit_id').value;
      const name = document.getElementById('edit_name').value.trim();
      const description = document.getElementById('edit_description').value.trim();
      const price = parseFloat(document.getElementById('edit_price').value);
      const image_url = document.getElementById('edit_image_url').value.trim();
      const status = document.getElementById('edit_status').value;

      if (!name || !description || isNaN(price) || !image_url || !status) { alert("Please fill in all fields"); return; }
      if (price <= 0) { alert("Price must be > 0"); return; }

      const res = await fetch(`/api/admin/products/${id}`, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name,description,price,image_url,status}) });
      if (!res.ok) { const error = await res.json(); alert(error.message || "Failed"); return; }

      closeEditModal(); showToast("Product updated successfully!"); fetchProducts();
    }

    async function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        await fetch(`/api/admin/products/${id}`, { method:"DELETE" });
        showToast("Product deleted successfully!"); fetchProducts();
      }
    }

    async function toggleStatus(id, currentStatus) {
      const newStatus = currentStatus === "available" ? "unavailable" : "available";
      const res = await fetch(`/api/admin/products/${id}/status`, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({status:newStatus}) });
      if (!res.ok) { alert("Failed to update status"); return; }
      showToast("Product status updated!"); fetchProducts();
    }

    fetchProducts();


    document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    // Call backend logout route
    const response = await fetch("/api/auth/logout", {
      method: "POST",
      credentials: "include" // important for session cookies
    });

    const data = await response.json();
    console.log(data.message); // Optional: show "Logged out successfully"

    // Clear any frontend data
    localStorage.removeItem("user"); // if storing user info
    // localStorage.removeItem("token"); // if you had JWT too

    // Redirect to login page
    window.location.href = "/";

  } catch (error) {
    console.error("Logout failed:", error);
  }
});

  </script>
</body>
</html>
