<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">

<div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
  <h2 class="text-2xl font-bold mb-4 text-center">Reset Password</h2>

  <form id="resetForm" class="space-y-4">
    <input
      type="password"
      id="password"
      placeholder="New password"
      class="w-full p-3 border rounded"
      required
      minlength="8"
    />

    <button
      id="resetBtn"
      class="w-full bg-green-600 text-white p-3 rounded font-semibold hover:bg-green-700 transition"
    >
      Reset Password
    </button>
  </form>

  <div id="msg" class="mt-4 text-center text-sm"></div>
</div>

<script>
  const token = window.location.pathname.split("/").pop();
  const form = document.getElementById("resetForm");
  const btn = document.getElementById("resetBtn");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    btn.disabled = true;
    btn.textContent = "Resetting...";
    msg.textContent = "";
    msg.className = "mt-4 text-center text-sm";

    const password = document.getElementById("password").value;

    try {
      const res = await fetch(`/api/auth/reset-password/${token}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });

      const result = await res.json();

      if (!res.ok) {
        throw new Error(result.message || "Something went wrong");
      }

      msg.textContent = "✅ Password updated successfully! Redirecting to login...";
      msg.classList.add("text-green-600");

      setTimeout(() => {
        window.location.href = "/login";
      }, 2000);

    } catch (err) {
      msg.textContent = err.message || "Failed to reset password";
      msg.classList.add("text-red-600");
      btn.disabled = false;
      btn.textContent = "Reset Password";
    }
  });
</script>

</body>
</html>
