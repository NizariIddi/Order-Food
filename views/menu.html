<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
  animation: fadeIn 0.25s ease-out;
}
</style>


<body class="bg-gradient-to-br from-gray-50 to-gray-100">

<!-- Navigation Bar -->
<nav class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 text-white shadow-xl sticky top-0 z-50 backdrop-blur-sm">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between py-2">
      <a href="/" class="text-sm md:text-base font-semibold flex items-center gap-2 hover:opacity-90 transition-opacity">
        <i class="fas fa-utensils text-xs"></i>
        <span>Food Ordering</span>
      </a>
      
      <!-- Desktop Navigation -->
      <div class="hidden md:flex flex-wrap gap-1 text-xs md:text-sm">
        <a href="/" class="px-3 py-1.5 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-1.5">
          <i class="fas fa-home text-xs"></i>
          <span>Home</span>
        </a>
        <a href="/menu" class="px-3 py-1.5 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-1.5">
          <i class="fas fa-book-open text-xs"></i>
          <span>Menu</span>
        </a>
        <a href="/orders" class="px-3 py-1.5 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-1.5">
          <i class="fas fa-shopping-bag text-xs"></i>
          <span>Orders</span>
        </a>
        <a 
          id="logoutBtn" 
          href="#"
          class="px-3 py-1.5 rounded-lg bg-red-600/90 hover:bg-red-700 transition-all duration-200 cursor-pointer font-medium shadow-md ml-2 flex items-center gap-1.5"
        >
          <i class="fas fa-right-from-bracket text-xs"></i>
          <span>Logout</span>
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <button id="hamburgerBtn" class="md:hidden p-2 rounded-lg hover:bg-white/10 transition-all">
        <i class="fas fa-bars text-xl"></i>
      </button>
    </div>
  </div>
</nav>

<!-- Mobile Sidebar -->
<div id="mobileSidebar" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden">
  <div class="fixed right-0 top-0 h-full w-64 bg-gradient-to-b from-green-600 via-green-700 to-green-800 shadow-2xl transform transition-transform duration-300 translate-x-full" id="sidebarContent">
    <div class="flex justify-between items-center p-4 border-b border-white/20">
      <h2 class="text-white font-bold text-lg">Menu</h2>
      <button id="closeSidebarBtn" class="text-white hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center transition-colors">
        <i class="fas fa-times text-lg"></i>
      </button>
    </div>
    <div class="flex flex-col p-4 gap-2">
      <a href="/" class="px-4 py-3 rounded-lg hover:bg-white/10 transition-all duration-200 flex items-center gap-3 text-white">
        <i class="fas fa-home text-sm"></i>
        <span>Home</span>
      </a>
      <a href="/menu" class="px-4 py-3 rounded-lg hover:bg-white/10 transition-all duration-200 flex items-center gap-3 text-white">
        <i class="fas fa-book-open text-sm"></i>
        <span>Menu</span>
      </a>
      <a href="/orders" class="px-4 py-3 rounded-lg hover:bg-white/10 transition-all duration-200 flex items-center gap-3 text-white">
        <i class="fas fa-shopping-bag text-sm"></i>
        <span>Orders</span>
      </a>
      <div class="h-px bg-white/20 my-2"></div>
      <a 
        id="logoutBtnMobile" 
        href="#"
        class="px-4 py-3 rounded-lg bg-red-600/90 hover:bg-red-700 transition-all duration-200 cursor-pointer font-medium shadow-md flex items-center gap-3 text-white"
      >
        <i class="fas fa-right-from-bracket text-sm"></i>
        <span>Logout</span>
      </a>
    </div>
  </div>
</div>

<div class="flex flex-col lg:flex-row min-h-screen mx-auto">

  <!-- MENU ITEMS -->
  <div class="w-full lg:w-3/4 p-4 md:p-6 lg:p-8">
    <div class="mb-6 max-w-7xl">
      <div class="flex items-center gap-2 mb-2">
        <div class="h-0.5 w-8 bg-gradient-to-r from-green-600 to-green-400 rounded-full"></div>
        <h1 class="text-base md:text-lg font-bold text-gray-800">Our Menu</h1>
      </div>
      <p class="text-xs text-gray-600 ml-10">Discover our delicious selection and add your favorites to cart</p>
    </div>
    <div id="menuContainer" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 max-w-7xl"></div>
  </div>

  <!-- CART SIDEBAR -->
  <div class="w-full lg:w-1/4 bg-white lg:border-l border-gray-200 shadow-2xl order-first lg:order-last lg:sticky lg:top-12 lg:h-[calc(100vh-3rem)]">
    <div class="p-4 lg:overflow-y-auto lg:h-full">
      <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-200">
        <div class="bg-gradient-to-br from-green-100 to-green-50 p-1.5 rounded-lg">
          <i class="fas fa-shopping-cart text-green-600 text-sm"></i>
        </div>
        <h2 class="text-sm font-bold text-gray-800">Shopping Cart</h2>
      </div>

      <div id="cartItems" class="space-y-2 mb-4"></div>

      <div class="border-t border-gray-200 pt-4 mt-4 space-y-3">
        <div class="bg-gradient-to-r from-gray-50 to-white rounded-lg p-3 border border-gray-100">
          <div class="flex justify-between items-center">
            <span class="text-xs font-semibold text-gray-700">Total Amount</span>
            <span class="text-base font-bold bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent">
              $<span id="cartTotal">0.00</span>
            </span>
          </div>
        </div>

        <button
          id="placeOrderBtn"
          class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-4 py-2.5 rounded-lg w-full text-sm font-semibold shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2">
          <i class="fas fa-check-circle text-xs"></i>
          <span>Place Order</span>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- Success Toast -->
<div id="successToast" class="hidden fixed top-16 right-4 bg-gradient-to-r from-green-600 to-green-700 text-white px-4 py-2.5 rounded-lg shadow-2xl z-50 backdrop-blur-sm border border-green-500/20">
  <div class="flex items-center gap-2">
    <i class="fas fa-check-circle text-sm"></i>
    <p id="toastMessage" class="text-sm font-medium"></p>
  </div>
</div>

<!-- Order Confirmation Modal -->
<div id="orderModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden transform transition-all">
    <div class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 px-6 py-4 flex justify-between items-center">
      <div>
        <h2 class="text-lg font-bold text-white mb-0.5 flex items-center gap-2">
          <i class="fas fa-clipboard-check text-sm"></i>
          <span>Confirm Your Order</span>
        </h2>
        <p class="text-green-100 text-xs">Please review before placing</p>
      </div>
      <button onclick="closeOrderModal()" class="text-white hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center transition-colors">
        <i class="fas fa-times text-base"></i>
      </button>
    </div>
    <div class="p-6">
      <div class="mb-4">
        <h3 class="font-semibold text-sm mb-3 text-gray-800 flex items-center gap-2">
          <span class="w-1 h-4 bg-gradient-to-b from-green-600 to-green-400 rounded-full"></span>
          Order Summary
        </h3>
        <div id="orderSummary" class="space-y-2 mb-3 bg-gray-50 rounded-lg p-3"></div>
        <div class="border-t-2 border-gray-200 pt-3 mt-3">
          <div class="flex justify-between items-center bg-gradient-to-r from-green-50 to-white rounded-lg p-3">
            <span class="text-sm font-bold text-gray-800">Total Amount</span>
            <span class="text-lg font-bold bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent">
              $<span id="modalTotal">0.00</span>
            </span>
          </div>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="confirmOrder()" class="flex-1 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-4 py-2.5 rounded-lg text-sm font-semibold shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-[1.02] flex items-center justify-center gap-2">
          <i class="fas fa-check text-xs"></i>
          <span>Confirm Order</span>
        </button>
        <button onclick="closeOrderModal()" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-lg text-sm font-semibold transition-all duration-200">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>


<!-- Feedback && Rating section-->

 <!-- Floating Feedback Button -->
<div class="fixed bottom-6 right-6 z-50">
  <button
    id="feedbackBtn"
    class="w-14 h-14 rounded-full bg-green-600 hover:bg-green-700 text-white shadow-2xl flex items-center justify-center transition-all duration-300 transform hover:scale-110"
  >
    <i class="fas fa-star text-lg"></i>
  </button>

  <!-- Feedback Popup -->
  <div
    id="feedbackPopup"
    class="hidden absolute bottom-16 right-0 w-72 bg-white rounded-xl shadow-2xl border border-gray-200 p-4 animate-fade-in"
  >
    <h3 class="text-sm font-bold text-gray-800 mb-2">Rate your experience</h3>

    <!-- Rating Stars -->
    <div class="flex gap-1 mb-3" id="ratingStars">
      <i class="fas fa-star text-gray-300 cursor-pointer" data-value="1"></i>
      <i class="fas fa-star text-gray-300 cursor-pointer" data-value="2"></i>
      <i class="fas fa-star text-gray-300 cursor-pointer" data-value="3"></i>
      <i class="fas fa-star text-gray-300 cursor-pointer" data-value="4"></i>
      <i class="fas fa-star text-gray-300 cursor-pointer" data-value="5"></i>
    </div>

    <!-- Feedback Input -->
    <textarea
      id="feedbackText"
      placeholder="Write your feedback..."
      class="w-full text-xs border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500 resize-none mb-3"
      rows="3"
    ></textarea>

    <!-- Submit -->
    <button
      id="submitFeedback"
      class="w-full bg-green-600 hover:bg-green-700 text-white text-xs py-2 rounded-lg font-semibold transition"
    >
      Submit
    </button>
  </div>
</div>


<script>
let cart = [];

// Mobile Sidebar Functionality
const hamburgerBtn = document.getElementById('hamburgerBtn');
const closeSidebarBtn = document.getElementById('closeSidebarBtn');
const mobileSidebar = document.getElementById('mobileSidebar');
const sidebarContent = document.getElementById('sidebarContent');

function openSidebar() {
  mobileSidebar.classList.remove('hidden');
  setTimeout(() => {
    sidebarContent.classList.remove('translate-x-full');
  }, 10);
}

function closeSidebar() {
  sidebarContent.classList.add('translate-x-full');
  setTimeout(() => {
    mobileSidebar.classList.add('hidden');
  }, 300);
}

hamburgerBtn.addEventListener('click', openSidebar);
closeSidebarBtn.addEventListener('click', closeSidebar);
mobileSidebar.addEventListener('click', (e) => {
  if (e.target === mobileSidebar) {
    closeSidebar();
  }
});

function showToast(message) {
  const toast = document.getElementById('successToast');
  document.getElementById('toastMessage').textContent = message;
  toast.classList.remove('hidden');
  setTimeout(() => { toast.classList.add('hidden'); }, 3000);
}

/* ================= LOAD MENU ================= */
async function loadMenu() {
  const res = await fetch("/api/menu");
  const items = await res.json();

  const container = document.getElementById("menuContainer");
  container.innerHTML = "";

  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "bg-white rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden relative group border border-gray-100";

    // Check availability
    const isAvailable = item.status === "available";
    const badge = isAvailable 
      ? "" 
      : `<span class="absolute top-2 right-2 px-2 py-1 text-xs font-bold rounded-full bg-red-500 text-white shadow-lg z-10 flex items-center gap-1"><i class="fas fa-ban text-xs"></i> Unavailable</span>`;

      const formattedPrice = new Intl.NumberFormat("sw-TZ", {
        style: "currency",
        currency: "TZS",
        minimumFractionDigits: 0
      }).format(item.price);


    div.innerHTML = `
      ${badge}
      <div class="relative overflow-hidden">
        <img src="${item.image_url}" class="w-full h-40 object-cover transform group-hover:scale-110 transition-transform duration-500">
        <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </div>
      <div class="p-3">
        <h3 class="font-bold text-sm mb-1 text-gray-800 line-clamp-1">${item.name}</h3>
        <p class="text-gray-600 mb-3 line-clamp-2 text-xs leading-relaxed">${item.description}</p>
        <div class="flex justify-between items-center pt-2 bg-green-50 p-4 rounded-lg  border-t border-gray-200">
          <span class="text-base font-bold bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent">${formattedPrice}</span>
          <button
            class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-200 shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95 flex items-center gap-1.5 ${!isAvailable ? 'opacity-50 cursor-not-allowed hover:scale-100' : ''}"
            ${!isAvailable ? 'disabled' : `onclick="addToCart(${item.id}, '${item.name}', ${item.price})"`}>
            <span>Add</span>
            <i class="fas fa-plus text-xs"></i>
          </button>
        </div>
      </div>
    `;

    container.appendChild(div);
  });
}

loadMenu();

/* ================= CART ================= */
function addToCart(id, name, price) {
  const existing = cart.find(i => i.id === id);
  if (existing) { existing.quantity++; } 
  else { cart.push({ id, name, price, quantity: 1 }); }

  showToast(`${name} added to cart!`);
  updateCartUI();
}

function updateCartUI() {
  const cartDiv = document.getElementById("cartItems");
  const totalSpan = document.getElementById("cartTotal");
  cartDiv.innerHTML = "";
  let total = 0;

  if (cart.length === 0) {
    cartDiv.innerHTML = `
      <div class="text-center py-8">
        <i class="fas fa-shopping-cart text-4xl mb-2 text-gray-200"></i>
        <p class="text-gray-400 text-xs font-medium">Your cart is empty</p>
      </div>
    `;
  }

  cart.forEach(item => {
    total += item.price * item.quantity;
    const div = document.createElement("div");
    div.className = "bg-gradient-to-r from-gray-50 to-white rounded-lg p-3 border border-gray-100 hover:shadow-md transition-shadow duration-200";
    div.innerHTML = `
      <div class="flex justify-between items-start mb-2">
        <div class="flex-1">
          <p class="font-semibold text-gray-800 text-xs mb-0.5">${item.name}</p>
          <p class="text-xs text-gray-500">$${item.price} × ${item.quantity}</p>
        </div>
        <p class="font-bold text-gray-900 text-sm">$${(item.price * item.quantity).toFixed(2)}</p>
      </div>
      <div class="flex gap-1.5 justify-end">
        <button onclick="changeQty(${item.id}, -1)" class="w-7 h-7 bg-gray-200 hover:bg-gray-300 rounded-lg font-bold text-xs transition-all duration-200 transform hover:scale-110 active:scale-95 flex items-center justify-center">
          <i class="fas fa-minus text-xs"></i>
        </button>
        <button onclick="changeQty(${item.id}, 1)" class="w-7 h-7 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold text-xs transition-all duration-200 transform hover:scale-110 active:scale-95 flex items-center justify-center">
          <i class="fas fa-plus text-xs"></i>
        </button>
      </div>
    `;
    cartDiv.appendChild(div);
  });

  totalSpan.textContent = total.toFixed(2);
}

function changeQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) { cart = cart.filter(i => i.id !== id); }
  updateCartUI();
}

/* ================= PLACE ORDER ================= */
document.getElementById("placeOrderBtn").addEventListener("click", openOrderModal);

function openOrderModal() {
  if (cart.length === 0) { 
    showToast("Your cart is empty!");
    return; 
  }

  const summaryDiv = document.getElementById('orderSummary');
  const modalTotal = document.getElementById('modalTotal');
  summaryDiv.innerHTML = '';
  let total = 0;

  cart.forEach(item => {
    total += item.price * item.quantity;
    const div = document.createElement('div');
    div.className = 'flex justify-between text-xs py-1.5 border-b border-gray-100 last:border-0';
    div.innerHTML = `
      <span class="text-gray-700"><span class="font-semibold text-gray-900">${item.quantity}×</span> ${item.name}</span>
      <span class="font-semibold text-gray-900">$${(item.price * item.quantity).toFixed(2)}</span>
    `;
    summaryDiv.appendChild(div);
  });

  modalTotal.textContent = total.toFixed(2);
  document.getElementById('orderModal').classList.remove('hidden');
}

function closeOrderModal() { document.getElementById('orderModal').classList.add('hidden'); }

async function confirmOrder() {
  const payload = {
    items: cart.map(item => ({ menu_item_id: item.id, quantity: item.quantity, price: item.price }))
  };
  const res = await fetch("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  const result = await res.json();

  if (res.ok) {
    closeOrderModal();
    showToast(`Order placed successfully! Order ID: ${result.orderId}`);
    cart = [];
    updateCartUI();
  } else {
    alert(result.message || "Failed to place order");
  }
}

// Logout handlers for both desktop and mobile
function handleLogout(e) {
  e.preventDefault();
  
  if (confirm("⚠️ Are you sure you want to logout?")) {
    fetch("/api/auth/logout", {
      method: "POST",
      credentials: "include"
    })
    .then(response => response.json())
    .then(data => {
      console.log(data.message);
      window.location.href = "/";
    })
    .catch(error => {
      console.error("Logout failed:", error);
      alert("Failed to logout. Please try again.");
    });
  }
}

document.getElementById("logoutBtn").addEventListener("click", handleLogout);
document.getElementById("logoutBtnMobile").addEventListener("click", handleLogout);


// Feedback and Rating Section
let selectedRating = 0;

const feedbackBtn = document.getElementById("feedbackBtn");
const feedbackPopup = document.getElementById("feedbackPopup");
const stars = document.querySelectorAll("#ratingStars i");

feedbackBtn.addEventListener("click", () => {
  feedbackPopup.classList.toggle("hidden");
});

/* Star Rating */
stars.forEach(star => {
  star.addEventListener("click", () => {
    selectedRating = star.dataset.value;
    stars.forEach(s => {
      s.classList.toggle("text-yellow-400", s.dataset.value <= selectedRating);
      s.classList.toggle("text-gray-300", s.dataset.value > selectedRating);
    });
  });
});

/* Submit Feedback */
document.getElementById("submitFeedback").addEventListener("click", async () => {
  const feedback = document.getElementById("feedbackText").value;

  if (selectedRating === 0) {
    alert("Please select a rating ⭐");
    return;
  }

  //send to backend

  await fetch("/api/feedback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({
      rating: selectedRating,
      feedback
    })
  });

  showToast("Thank you for your feedback! ❤️");

  // Reset
  selectedRating = 0;
  stars.forEach(s => s.classList.replace("text-yellow-400", "text-gray-300"));
  document.getElementById("feedbackText").value = "";
  feedbackPopup.classList.add("hidden");
});

</script>

</body>
</html>
