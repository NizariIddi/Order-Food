<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-100">

<!-- Navigation Bar -->
<nav class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 text-white shadow-xl sticky top-0 z-50 backdrop-blur-sm">
  <div class="container mx-auto px-6">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between py-4">
        <a href="/" class="text-base md:text-lg font-bold mb-3 md:mb-0 flex items-center gap-2 hover:opacity-90 transition-opacity">
          <i class="fas fa-utensils"></i>
          <span>Food Ordering</span>
        </a>
        <div class="flex flex-wrap gap-1 text-sm md:text-base">
          <a href="/" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-2">
            <i class="fas fa-home"></i>
            <span>Home</span>
          </a>
          <a href="/menu" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-2">
            <i class="fas fa-book-open"></i>
            <span>Menu</span>
          </a>
          <a href="/orders" class="px-4 py-2 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-2">
            <i class="fas fa-shopping-bag"></i>
            <span>Orders</span>
          </a>
          <a 
            id="logoutBtn" 
            href="#"
            class="px-4 py-2 rounded-lg bg-red-600/90 hover:bg-red-700 transition-all duration-200 cursor-pointer font-medium shadow-md ml-2 flex items-center gap-2"
          >
            <i class="fas fa-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </div>
      </div>
  </div>
</nav>

<div class="flex flex-col lg:flex-row min-h-screen mx-auto">

  <!-- MENU ITEMS -->
  <div class="w-full lg:w-3/4 p-6 md:p-8 lg:p-10">
    <div class="mb-8 max-w-7xl">
      <div class="flex items-center gap-3 mb-3">
        <div class="h-1 w-12 bg-gradient-to-r from-green-600 to-green-400 rounded-full"></div>
        <h1 class="text-xl md:text-2xl font-bold text-gray-800">Our Menu</h1>
      </div>
      <p class="text-gray-600 ml-15">Discover our delicious selection and add your favorites to cart</p>
    </div>
    <div id="menuContainer" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6 max-w-7xl"></div>
  </div>

  <!-- CART SIDEBAR -->
  <div class="w-full lg:w-1/4 bg-white lg:border-l border-gray-200 shadow-2xl order-first lg:order-last lg:sticky lg:top-16 lg:h-[calc(100vh-4rem)]">
    <div class="p-6 lg:overflow-y-auto lg:h-full">
      <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-200">
        <div class="bg-gradient-to-br from-green-100 to-green-50 p-2 rounded-lg">
          <i class="fas fa-shopping-cart text-green-600 text-xl"></i>
        </div>
        <h2 class="text-lg font-bold text-gray-800">Shopping Cart</h2>
      </div>

      <div id="cartItems" class="space-y-3 mb-6"></div>

      <div class="border-t border-gray-200 pt-6 mt-6 space-y-4">
        <div class="bg-gradient-to-r from-gray-50 to-white rounded-xl p-4 border border-gray-100">
          <div class="flex justify-between items-center">
            <span class="text-base font-semibold text-gray-700">Total Amount</span>
            <span class="text-xl font-bold bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent">
              $<span id="cartTotal">0.00</span>
            </span>
          </div>
        </div>

        <button
          id="placeOrderBtn"
          class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-6 py-4 rounded-xl w-full font-semibold shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2">
          <i class="fas fa-check-circle"></i>
          <span>Place Order</span>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- Success Toast -->
<div id="successToast" class="hidden fixed top-24 right-6 bg-gradient-to-r from-green-600 to-green-700 text-white px-6 py-4 rounded-xl shadow-2xl z-50 backdrop-blur-sm border border-green-500/20">
  <div class="flex items-center gap-3">
    <i class="fas fa-check-circle text-xl"></i>
    <p id="toastMessage" class="font-semibold"></p>
  </div>
</div>

<!-- Order Confirmation Modal -->
<div id="orderModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden transform transition-all">
    <div class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 px-8 py-6 flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-bold text-white mb-1 flex items-center gap-2">
          <i class="fas fa-clipboard-check"></i>
          <span>Confirm Your Order</span>
        </h2>
        <p class="text-green-100 text-sm">Please review before placing</p>
      </div>
      <button onclick="closeOrderModal()" class="text-white hover:bg-white/20 rounded-full w-10 h-10 flex items-center justify-center transition-colors">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>
    <div class="p-8">
      <div class="mb-4">
        <h3 class="font-semibold text-lg mb-4 text-gray-800 flex items-center gap-2">
          <span class="w-1.5 h-6 bg-gradient-to-b from-green-600 to-green-400 rounded-full"></span>
          Order Summary
        </h3>
        <div id="orderSummary" class="space-y-3 mb-4 bg-gray-50 rounded-xl p-4"></div>
        <div class="border-t-2 border-gray-200 pt-4 mt-4">
          <div class="flex justify-between items-center bg-gradient-to-r from-green-50 to-white rounded-xl p-4">
            <span class="text-lg font-bold text-gray-800">Total Amount</span>
            <span class="text-2xl font-bold bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent">
              $<span id="modalTotal">0.00</span>
            </span>
          </div>
        </div>
      </div>
      <div class="flex gap-3">
        <button onclick="confirmOrder()" class="flex-1 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-6 py-3.5 rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-[1.02] flex items-center justify-center gap-2">
          <i class="fas fa-check"></i>
          <span>Confirm Order</span>
        </button>
        <button onclick="closeOrderModal()" class="px-6 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl font-semibold transition-all duration-200">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>

<script>
let cart = [];

function showToast(message) {
  const toast = document.getElementById('successToast');
  document.getElementById('toastMessage').textContent = message;
  toast.classList.remove('hidden');
  setTimeout(() => { toast.classList.add('hidden'); }, 3000);
}

/* ================= LOAD MENU ================= */
async function loadMenu() {
  const res = await fetch("/api/menu");
  const items = await res.json();

  const container = document.getElementById("menuContainer");
  container.innerHTML = "";

  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden relative group border border-gray-100";

    // Check availability
    const isAvailable = item.status === "available";
    const badge = isAvailable 
      ? "" 
      : `<span class="absolute top-3 right-3 px-3 py-1.5 text-xs font-bold rounded-full bg-red-500 text-white shadow-lg z-10 flex items-center gap-1"><i class="fas fa-ban"></i> Unavailable</span>`;

      const formattedPrice = new Intl.NumberFormat("sw-TZ", {
        style: "currency",
        currency: "TZS",
        minimumFractionDigits: 0
      }).format(item.price);


    div.innerHTML = `
      ${badge}
      <div class="relative overflow-hidden">
        <img src="${item.image_url}" class="w-full h-52 object-cover transform group-hover:scale-110 transition-transform duration-500">
        <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      </div>
      <div class="p-5">
        <h3 class="font-bold text-xl mb-2 text-gray-800 line-clamp-1">${item.name}</h3>
        <p class="text-gray-600 mb-4 line-clamp-2 text-sm leading-relaxed">${item.description}</p>
        <div class="flex justify-between items-center pt-3 border-t border-gray-100">
          <span class="text-2xl font-bold bg-gradient-to-r from-green-600 to-green-500 bg-clip-text text-transparent">${formattedPrice}</span>
          <button
            class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-5 py-2.5 rounded-lg font-medium transition-all duration-200 shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95 flex items-center gap-2 ${!isAvailable ? 'opacity-50 cursor-not-allowed hover:scale-100' : ''}"
            ${!isAvailable ? 'disabled' : `onclick="addToCart(${item.id}, '${item.name}', ${item.price})"`}>
            <span>Add</span>
            <i class="fas fa-plus"></i>
          </button>
        </div>
      </div>
    `;

    container.appendChild(div);
  });
}

loadMenu();

/* ================= CART ================= */
function addToCart(id, name, price) {
  const existing = cart.find(i => i.id === id);
  if (existing) { existing.quantity++; } 
  else { cart.push({ id, name, price, quantity: 1 }); }

  showToast(`${name} added to cart!`);
  updateCartUI();
}

function updateCartUI() {
  const cartDiv = document.getElementById("cartItems");
  const totalSpan = document.getElementById("cartTotal");
  cartDiv.innerHTML = "";
  let total = 0;

  if (cart.length === 0) {
    cartDiv.innerHTML = `
      <div class="text-center py-12">
        <i class="fas fa-shopping-cart text-6xl mb-3 text-gray-200"></i>
        <p class="text-gray-400 font-medium">Your cart is empty</p>
      </div>
    `;
  }

  cart.forEach(item => {
    total += item.price * item.quantity;
    const div = document.createElement("div");
    div.className = "bg-gradient-to-r from-gray-50 to-white rounded-xl p-4 border border-gray-100 hover:shadow-md transition-shadow duration-200";
    div.innerHTML = `
      <div class="flex justify-between items-start mb-3">
        <div class="flex-1">
          <p class="font-semibold text-gray-800 mb-1">${item.name}</p>
          <p class="text-sm text-gray-500">$${item.price} × ${item.quantity}</p>
        </div>
        <p class="font-bold text-gray-900 text-lg">$${(item.price * item.quantity).toFixed(2)}</p>
      </div>
      <div class="flex gap-2 justify-end">
        <button onclick="changeQty(${item.id}, -1)" class="w-9 h-9 bg-gray-200 hover:bg-gray-300 rounded-lg font-bold transition-all duration-200 transform hover:scale-110 active:scale-95 flex items-center justify-center">
          <i class="fas fa-minus text-sm"></i>
        </button>
        <button onclick="changeQty(${item.id}, 1)" class="w-9 h-9 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold transition-all duration-200 transform hover:scale-110 active:scale-95 flex items-center justify-center">
          <i class="fas fa-plus text-sm"></i>
        </button>
      </div>
    `;
    cartDiv.appendChild(div);
  });

  totalSpan.textContent = total.toFixed(2);
}

function changeQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) { cart = cart.filter(i => i.id !== id); }
  updateCartUI();
}

/* ================= PLACE ORDER ================= */
document.getElementById("placeOrderBtn").addEventListener("click", openOrderModal);

function openOrderModal() {
  if (cart.length === 0) { 
    showToast("Your cart is empty!");
    return; 
  }

  const summaryDiv = document.getElementById('orderSummary');
  const modalTotal = document.getElementById('modalTotal');
  summaryDiv.innerHTML = '';
  let total = 0;

  cart.forEach(item => {
    total += item.price * item.quantity;
    const div = document.createElement('div');
    div.className = 'flex justify-between text-sm py-2 border-b border-gray-100 last:border-0';
    div.innerHTML = `
      <span class="text-gray-700"><span class="font-semibold text-gray-900">${item.quantity}×</span> ${item.name}</span>
      <span class="font-semibold text-gray-900">$${(item.price * item.quantity).toFixed(2)}</span>
    `;
    summaryDiv.appendChild(div);
  });

  modalTotal.textContent = total.toFixed(2);
  document.getElementById('orderModal').classList.remove('hidden');
}

function closeOrderModal() { document.getElementById('orderModal').classList.add('hidden'); }

async function confirmOrder() {
  const payload = {
    items: cart.map(item => ({ menu_item_id: item.id, quantity: item.quantity, price: item.price }))
  };
  const res = await fetch("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  const result = await res.json();

  if (res.ok) {
    closeOrderModal();
    showToast(`Order placed successfully! Order ID: ${result.orderId}`);
    cart = [];
    updateCartUI();
  } else {
    alert(result.message || "Failed to place order");
  }
}

document.getElementById("logoutBtn").addEventListener("click", async (e) => {
  e.preventDefault();
  
  if (confirm("⚠️ Are you sure you want to logout?")) {
    try {
      const response = await fetch("/api/auth/logout", {
        method: "POST",
        credentials: "include"
      });

      const data = await response.json();
      console.log(data.message);

      localStorage.removeItem("user");
      window.location.href = "/";

    } catch (error) {
      console.error("Logout failed:", error);
      alert("Failed to logout. Please try again.");
    }
  }
});

</script>

</body>
</html>
