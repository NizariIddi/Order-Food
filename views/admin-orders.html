<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 text-white shadow-xl sticky top-0 z-50 backdrop-blur-sm">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between py-2">
        <a href="/" class="text-sm md:text-base font-semibold mb-2 md:mb-0 flex items-center gap-2 hover:opacity-90 transition-opacity">
          <i class="fas fa-utensils text-xs"></i>
          <span>Food Ordering</span>
        </a>
        <div class="flex flex-wrap gap-1 text-xs md:text-sm">
          <a href="/" class="px-3 py-1.5 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-1.5">
            <i class="fas fa-home text-xs"></i>
            <span>Home</span>
          </a>
          <a href="/menu" class="px-3 py-1.5 rounded-lg hover:bg-white/10 transition-all duration-200 backdrop-blur-sm flex items-center gap-1.5">
            <i class="fas fa-book-open text-xs"></i>
            <span>Menu</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <div class="h-0.5 w-8 bg-gradient-to-r from-green-600 to-green-400 rounded-full"></div>
          <h1 class="text-base md:text-lg font-bold text-gray-800">Admin - Manage Orders</h1>
        </div>
        <p class="text-xs text-gray-600 ml-10">View and update order statuses</p>
      </div>
      <a href="/admin" class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-4 py-2 rounded-lg transition-all duration-200 shadow-lg hover:shadow-xl text-xs font-semibold flex items-center gap-1.5">
        <i class="fas fa-arrow-left text-xs"></i>
        <span>Products</span>
      </a>
    </div>

    <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-100">
      <div class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 px-4 py-3">
        <h2 class="text-sm md:text-base font-bold text-white flex items-center gap-1.5">
          <i class="fas fa-shopping-bag text-xs"></i>
          <span>All Orders</span>
        </h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full" id="ordersTable">
          <thead class="bg-gradient-to-r from-gray-50 to-gray-100 border-b-2 border-gray-200">
            <tr>
              <th class="px-3 py-2 text-left text-xs font-bold text-gray-700">Order ID</th>
              <th class="px-3 py-2 text-left text-xs font-bold text-gray-700">Customer</th>
              <th class="px-3 py-2 text-left text-xs font-bold text-gray-700">Items</th>
              <th class="px-3 py-2 text-left text-xs font-bold text-gray-700">Total</th>
              <th class="px-3 py-2 text-left text-xs font-bold text-gray-700">Status</th>
              <th class="px-3 py-2 text-left text-xs font-bold text-gray-700">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Update Order Modal -->
  <div id="updateModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full">
      <div class="bg-gradient-to-r from-green-600 via-green-700 to-green-600 px-6 py-4 flex justify-between items-center">
        <div>
          <h2 class="text-base font-bold text-white mb-0.5 flex items-center gap-1.5">
            <i class="fas fa-edit text-sm"></i>
            <span>Update Order Status</span>
          </h2>
          <p class="text-green-100 text-xs">Modify the order status below</p>
        </div>
        <button onclick="closeUpdateModal()" class="text-white hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center transition-colors">
          <i class="fas fa-times text-base"></i>
        </button>
      </div>
      <div class="p-6">
        <input type="hidden" id="update_order_id">
        <div class="mb-4">
          <h3 class="font-semibold text-sm mb-3 flex items-center gap-1.5">
            <i class="fas fa-receipt text-green-600 text-xs"></i>
            Order #<span id="modal_order_id"></span>
          </h3>
          <div class="mb-4 bg-gray-50 rounded-lg p-3 border border-gray-100">
            <p class="text-xs text-gray-600 mb-1">Customer:</p>
            <p class="font-medium text-xs" id="modal_customer"></p>
          </div>
          <div class="mb-4">
            <label class="block text-xs font-bold text-gray-700 mb-1.5">Update Status</label>
            <select id="modal_status" class="w-full border-2 border-gray-200 p-2 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-xs transition-all">
              <option value="pending">Pending</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="confirmUpdate()" class="flex-1 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-4 py-2.5 rounded-lg text-xs font-bold shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-[1.02] flex items-center justify-center gap-1.5">
            <i class="fas fa-check text-xs"></i>
            <span>Update Order</span>
          </button>
          <button onclick="closeUpdateModal()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-lg text-xs font-bold transition-all duration-200">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Success Toast -->
  <div id="successToast" class="hidden fixed top-16 right-4 bg-gradient-to-r from-green-600 to-green-700 text-white px-4 py-2.5 rounded-lg shadow-2xl z-50 backdrop-blur-sm border border-green-500/20">
    <div class="flex items-center gap-2">
      <i class="fas fa-check-circle text-sm"></i>
      <p id="toastMessage" class="text-sm font-medium"></p>
    </div>
  </div>

  <script>
    const tbody = document.querySelector("#ordersTable tbody");

    function showToast(message) {
      const toast = document.getElementById('successToast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }

    function openUpdateModal(order) {
      document.getElementById('update_order_id').value = order.order_id;
      document.getElementById('modal_order_id').textContent = order.order_id;
      document.getElementById('modal_customer').textContent = `${order.customer_name} (${order.customer_email})`;
      document.getElementById('modal_status').value = order.status;
      document.getElementById('updateModal').classList.remove('hidden');
    }

    function closeUpdateModal() {
      document.getElementById('updateModal').classList.add('hidden');
    }

    async function confirmUpdate() {
      const id = document.getElementById('update_order_id').value;
      const status = document.getElementById('modal_status').value;

      const res = await fetch(`/api/admin/orders/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });

      const data = await res.json();

      if (!res.ok) {
        alert(data.message || "Failed to update order");
        return;
      }

      closeUpdateModal();
      showToast("Order updated successfully!");
      fetchOrders();
    }

    async function fetchOrders() {
      const res = await fetch("/api/admin/orders");
      const orders = await res.json();
      console.log(orders);
      tbody.innerHTML = "";

      if (!Array.isArray(orders)) {
        console.error("Orders API did not return an array:", orders);
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-500 text-xs">Failed to load orders</td></tr>';
        return;
      }

      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8"><div class="flex flex-col items-center"><i class="fas fa-inbox text-4xl text-gray-300 mb-2"></i><p class="text-gray-500 text-xs">No orders yet</p></div></td></tr>';
        return;
      }

      orders.forEach(order => {
        const tr = document.createElement("tr");
        tr.className = "border-b border-gray-100 hover:bg-gradient-to-r hover:from-green-50 hover:to-transparent transition-all duration-200";

        let itemsHtml = "";
        if (order.items && Array.isArray(order.items)) {
          itemsHtml = order.items.map(i => `<div class="text-xs mb-1">${i.item} × ${i.quantity}</div>`).join("");
        }

        const statusColors = {
          'pending': 'bg-yellow-100 text-yellow-800 border-yellow-300',
          'in-progress': 'bg-blue-100 text-blue-800 border-blue-300',
          'completed': 'bg-green-100 text-green-800 border-green-300',
          'cancelled': 'bg-red-100 text-red-800 border-red-300'
        };

        const statusLabels = {
          'pending': 'Pending',
          'in-progress': 'In Progress',
          'completed': 'Completed',
          'cancelled': 'Cancelled'
        };

        const statusIcons = {
          'pending': 'fa-clock',
          'in-progress': 'fa-fire',
          'completed': 'fa-check-circle',
          'cancelled': 'fa-times-circle'
        };

        tr.innerHTML = `
          <td class="px-3 py-2.5 text-xs font-bold text-gray-700">#${order.order_id}</td>
          <td class="px-3 py-2.5 text-xs">
            <div class="font-medium text-gray-800">${order.customer_name}</div>
            <div class="text-gray-500 text-xs">${order.customer_email}</div>
          </td>
          <td class="px-3 py-2.5">${itemsHtml}</td>
          <td class="px-3 py-2.5">
            <span class="font-bold text-green-600 text-xs">$${parseFloat(order.total_price).toFixed(2)}</span>
          </td>
          <td class="px-3 py-2.5">
            <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-bold border ${statusColors[order.status] || ''}">
              <i class="fas ${statusIcons[order.status]} text-xs"></i>
              ${statusLabels[order.status] || order.status}
            </span>
          </td>
          <td class="px-3 py-2.5">
            <button onclick='openUpdateModal(${JSON.stringify(order).replace(/'/g, "&apos;")})' class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-all shadow-md hover:shadow-lg transform hover:scale-105 active:scale-95 w-full sm:w-auto flex items-center justify-center gap-1">
              <i class="fas fa-edit text-xs"></i>
              <span>Update</span>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    fetchOrders();
  </script>
</body>
</html>
