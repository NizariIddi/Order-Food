<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Navigation Bar -->
  <nav class="bg-gradient-to-r from-green-600 to-green-700 text-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between py-4">
        <a href="/" class="text-2xl md:text-3xl font-bold mb-3 md:mb-0">🍔 Food Ordering</a>
        <div class="flex flex-wrap gap-2 md:gap-1">
          <a href="/" class="px-4 py-2 rounded-lg hover:bg-green-500 transition-colors duration-200">Home</a>
          <a href="/menu" class="px-4 py-2 rounded-lg hover:bg-green-500 transition-colors duration-200">Menu</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-800">📦 Admin - Manage Orders</h1>
      <a href="/admin" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors duration-200 shadow-md font-medium">
        ← Products
      </a>
    </div>

    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="bg-gradient-to-r from-green-500 to-green-600 px-6 py-4">
        <h2 class="text-xl md:text-2xl font-bold text-white">All Orders</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full" id="ordersTable">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Order ID</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Customer</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Items</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Total</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Status</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Update Order Modal -->
  <div id="updateModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full">
      <div class="bg-gradient-to-r from-green-500 to-green-600 px-6 py-4 flex justify-between items-center">
        <h2 class="text-2xl font-bold text-white">Update Order Status</h2>
        <button onclick="closeUpdateModal()" class="text-white hover:text-gray-200 text-3xl font-bold">&times;</button>
      </div>
      <div class="p-6">
        <input type="hidden" id="update_order_id">
        <div class="mb-4">
          <h3 class="font-semibold text-lg mb-3">Order #<span id="modal_order_id"></span></h3>
          <div class="mb-4">
            <p class="text-sm text-gray-600 mb-1">Customer:</p>
            <p class="font-medium" id="modal_customer"></p>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Update Status</label>
            <select id="modal_status" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-green-500">
              <option value="pending">Pending</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div class="flex gap-3">
          <button onclick="confirmUpdate()" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-semibold shadow-md transition-colors duration-200">
            Update Order
          </button>
          <button onclick="closeUpdateModal()" class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg font-semibold transition-colors duration-200">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Success Toast -->
  <div id="successToast" class="hidden fixed top-20 right-4 bg-green-600 text-white px-6 py-4 rounded-lg shadow-lg z-50">
    <p id="toastMessage" class="font-semibold"></p>
  </div>

  <script>
    const tbody = document.querySelector("#ordersTable tbody");

    function showToast(message) {
      const toast = document.getElementById('successToast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }

    function openUpdateModal(order) {
      document.getElementById('update_order_id').value = order.order_id;
      document.getElementById('modal_order_id').textContent = order.order_id;
      document.getElementById('modal_customer').textContent = `${order.customer_name} (${order.customer_email})`;
      document.getElementById('modal_status').value = order.status;
      document.getElementById('updateModal').classList.remove('hidden');
    }

    function closeUpdateModal() {
      document.getElementById('updateModal').classList.add('hidden');
    }

    async function confirmUpdate() {
      const id = document.getElementById('update_order_id').value;
      const status = document.getElementById('modal_status').value;

      const res = await fetch(`/api/admin/orders/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });

      const data = await res.json();

      if (!res.ok) {
        alert(data.message || "Failed to update order");
        return;
      }

      closeUpdateModal();
      showToast("Order updated successfully!");
      fetchOrders();
    }

    async function fetchOrders() {
      const res = await fetch("/api/admin/orders");
      const orders = await res.json();
      console.log(orders);
      tbody.innerHTML = "";

      if (!Array.isArray(orders)) {
        console.error("Orders API did not return an array:", orders);
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-500">Failed to load orders</td></tr>';
        return;
      }

      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-500">No orders yet</td></tr>';
        return;
      }

      orders.forEach(order => {
        const tr = document.createElement("tr");
        tr.className = "border-b border-gray-200 hover:bg-gray-50 transition-colors";

        let itemsHtml = "";
        if (order.items && Array.isArray(order.items)) {
          itemsHtml = order.items.map(i => `<div class="text-sm mb-1">${i.item} × ${i.quantity}</div>`).join("");
        }

        const statusColors = {
          'pending': 'bg-yellow-100 text-yellow-800 border-yellow-300',
          'in-progress': 'bg-blue-100 text-blue-800 border-blue-300',
          'completed': 'bg-green-100 text-green-800 border-green-300',
          'cancelled': 'bg-red-100 text-red-800 border-red-300'
        };

        const statusLabels = {
          'pending': 'Pending',
          'in-progress': 'In Progress',
          'completed': 'Completed',
          'cancelled': 'Cancelled'
        };

        tr.innerHTML = `
          <td class="px-4 py-3 text-sm font-semibold">#${order.order_id}</td>
          <td class="px-4 py-3 text-sm">
            <div class="font-medium text-gray-800">${order.customer_name}</div>
            <div class="text-gray-500 text-xs">${order.customer_email}</div>
          </td>
          <td class="px-4 py-3">${itemsHtml}</td>
          <td class="px-4 py-3">
            <span class="font-bold text-green-600 text-lg">$${parseFloat(order.total_price).toFixed(2)}</span>
          </td>
          <td class="px-4 py-3">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold border ${statusColors[order.status] || ''}">
              ${statusLabels[order.status] || order.status}
            </span>
          </td>
          <td class="px-4 py-3">
            <button onclick='openUpdateModal(${JSON.stringify(order).replace(/'/g, "&apos;")})' class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors w-full sm:w-auto">
              Update
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    fetchOrders();
  </script>
</body>
</html>
